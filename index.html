<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Animated Quiz — 20s per question</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="quiz-wrapper">
    <header class="quiz-header">
      <h1>Quick Quiz</h1>
      <div class="meta">
        <div id="progressText">Question 1 / 11</div>
        <div id="scoreText">Score: 0</div>
      </div>
    </header>

    <section id="card" class="card fade-in">
      <div class="timer-row">
        <div id="timeLabel">20s</div>
        <div class="time-bar-outer" aria-hidden="true">
          <div id="timeBar" class="time-bar"></div>
        </div>
      </div>

      <h2 id="question" class="question">Question goes here</h2>

      <div id="options" class="options"></div>

      <div class="controls">
        <button id="nextBtn" class="btn" disabled>Next</button>
        <button id="restartBtn" class="btn ghost hidden">Restart</button>
      </div>
    </section>

    <section id="result" class="card hidden fade-in">
      <h2>Quiz Completed 🎉</h2>
      <p id="finalScore">You scored 0 / 11</p>
      <button id="restartBtn2" class="btn">Restart Quiz</button>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
